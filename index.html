<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>videojs-vr Demo</title>
    <!-- <link href="../node_modules/video.js/dist/video-js.css" rel="stylesheet" /> -->
    <link href="https://vjs.zencdn.net/8.9.0/video-js.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/videojs-vr@2.0.0/dist/videojs-vr.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <form id="login-form">
      <input type="text" placeholder="link" id="input-form" />
      <button type="submit">change</button>
    </form>

    <video
      width="640"
      height="300"
      id="videojs-vr-player"
      class="video-js vjs-default-skin"
      controls
      playsinline="playsinline"
      crossorigin="anonymous"
      webkit-playsinline="true"
      x5-playsinline="true"
      x5-video-player-type="h5"
      x5-video-player-fullscreen="false"
    ></video>
    <script src="https://vjs.zencdn.net/8.9.0/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-vr@2.0.0/dist/videojs-vr.min.js"></script>
    <script>
      (function (window, videojs) {
        var player = (window.player = videojs("videojs-vr-player", {
          playbackRates: [0.5, 1, 1.5, 2, 3, 5],
          controlBar: {
            skipButtons: {
              forward: 10,
              backward: 10,
            },
          },
        }));
        player.mediainfo = player.mediainfo || {};
        player.mediainfo.projection = "360";
        player.mediainfo.forceCardboard = false;
        player.mediainfo.motionControls = true;

        var vr = (window.vr = player.vr({
          projection: "360",
          forceCardboard: false,
          motionControls: true,
        }));
        console.log(vr);
      })(window, window.videojs);

      function setupMotionControls() {
        // Get the VR plugin instance

        console.log("Motion controls enabled");
      }

      function enableMotionControl() {
        if (
          typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function"
        ) {
          // iOS 13+ requires permission
          DeviceOrientationEvent.requestPermission()
            .then((response) => {
              if (response === "granted") {
                setupMotionControls();
              } else {
                alert("Motion control requires permission");
              }
            })
            .catch(console.error);
        }
      }
      enableMotionControl();
    </script>
    <script>
      let loginForm = document.getElementById("login-form");

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();

        let input = document.getElementById("input-form");

        if (window.player) {
          window.player.src({
            type: "video/mp4",
            src: input.value,
          });
        }
      });
    </script>
  </body>
</html>
