<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>videojs-vr Demo</title>
    <!-- <link href="../node_modules/video.js/dist/video-js.css" rel="stylesheet" /> -->
    <!-- <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
      -->
    <link
      href="https://unpkg.com/video.js@8.23.0/dist/video-js.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/videojs-vr@2.0.0/dist/videojs-vr.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <form id="login-form">
      <input type="text" placeholder="link" id="input-form" />
      <button type="submit">change</button>
    </form>

    <!-- <video
      class="vjs-tech"
      playsinline="playsinline"
      crossorigin="anonymous"
    ></video> -->

    <video
      width="640"
      height="300"
      id="videojs-vr-player"
      class="video-js vjs-default-skin"
      controls
      playsinline="playsinline"
      crossorigin="anonymous"
      webkit-playsinline="true"
      x5-playsinline="true"
      x5-video-player-type="h5"
      x5-video-player-fullscreen="false"
    ></video>
    <!-- <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script> -->
    <script src="https://unpkg.com/video.js@8.23.0/dist/video.min.js"></script>
    <script type="module">
      import xhr from "https://cdn.jsdelivr.net/npm/@videojs/xhr@2.7.0/+esm";
    </script>
    <!-- <script src="../node_modules/video.js/dist/video.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/videojs-vr@2.0.0/dist/videojs-vr.min.js"></script>
    <script>
      (function (window, videojs) {
        var player = (window.player = videojs("videojs-vr-player", {
          controlBar: {
            skipButtons: {
              forward: 10,
              backward: 10,
            },
          },
        }));
        player.mediainfo = player.mediainfo || {};
        player.mediainfo.projection = "360";
        player.xhr = new window.XMLHttpRequest({
          headers: {
            "x-oss-object-type:": "Multipart",
          },
        });

        // player.Hls.xhr.beforeRequest = function (options) {
        //   /*
        //    * Modifications to requests that will affect every player.
        //    */

        //   if (options.headers == undefined) {
        //     options.headers = {};
        //   }
        //   options.headers["test"] = "1234";

        //   return options;
        // };

        var vr = (window.vr = player.vr({
          projection: "360",
          debug: true,
          forceCardboard: false,
        }));
        console.log(player);
      })(window, window.videojs);
    </script>
    <script>
      let loginForm = document.getElementById("login-form");

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();

        let input = document.getElementById("input-form");

        if (window.player) {
          window.player.src({
            type: "video/mp4",
            src: "" + input.value + "",
          });
          console.log(window.player, "player");
        }
      });
    </script>
  </body>
</html>
